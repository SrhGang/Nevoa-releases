name: Update latest.json

on:
  repository_dispatch:
    types: [new-release]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASES_PAT }}

      - name: Update latest.json
        env:
          VERSION_RAW: ${{ github.event.client_payload.version }}
          CHANGELOG: ${{ github.event.client_payload.changelog }}
          BREAKING: ${{ github.event.client_payload.breaking }}
        run: |
          # Retire le "v" si présent
          VERSION="${VERSION_RAW#v}"
          
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "releaseDate": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
            "downloadUrl": "https://github.com/SrhGang/Nevoa-releases/releases/download/v$VERSION/nevoa-$VERSION.apk",
            "changelog": "$CHANGELOG",
            "breaking": $BREAKING
          }
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "release: v${{ github.event.client_payload.version }}"
          git push
